name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and Build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name gradlew | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in $GRADLEW_DIR"
          cd "$GRADLEW_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "No gradlew found"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apks
        path: '**/*.apk'
